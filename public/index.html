<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Habit Terminal</title>
    <meta name="theme-color" content="#f0e5d0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Habit Terminal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#E96A4A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header id="app-header" class="app-header" data-variant="poster">
        <div class="header-blob" aria-hidden="true"></div>
        <svg class="header-mountains" viewBox="0 0 390 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 140 L 70 80 L 110 110 L 170 60 L 230 100 L 310 50 L 390 110 L 390 200 L 0 200 Z"
            fill="#2d4d35" opacity="0.6"/>
          <path d="M0 170 L 60 130 L 130 155 L 200 120 L 280 150 L 360 125 L 390 145 L 390 200 L 0 200 Z"
            fill="#1a1d2e" opacity="0.85"/>
        </svg>
        <div class="header-copy">
          <div class="header-meta-row">
            <div id="header-kicker" class="header-kicker">Today</div>
            <div class="header-avatar" aria-hidden="true">A</div>
          </div>
          <h1 id="header-title" class="header-title">Good day</h1>
          <p id="header-subtitle" class="header-subtitle" hidden></p>
        </div>
      </header>

      <section id="calendar-view" class="screen-view"></section>
      <section id="today-view" class="screen-view" hidden></section>
      <section id="tasks-view" class="screen-view" hidden></section>
      <section id="insights-view" class="screen-view" hidden></section>
      <section id="habit-detail-view" class="screen-view" hidden></section>

      <nav class="bottom-nav" aria-label="Primary">
        <button class="bottom-nav-item is-active" data-nav-view="calendar" type="button">
          <svg class="bottom-nav-icon" viewBox="0 0 14 14" aria-hidden="true">
            <rect x="1.5" y="2.5" width="11" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 1V4 M10 1V4 M1.5 5.5H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </svg>
          Calendar
        </button>
        <button class="bottom-nav-item" data-nav-view="today" type="button">
          <svg class="bottom-nav-icon" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M2 12 Q 2 6 7 4 Q 12 3 12 8 Q 12 12 7 12 Q 4 12 2 12 Z M5 11 Q 7 9 9 7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          </svg>
          Habits
        </button>
        <button class="bottom-nav-item" data-nav-view="tasks" type="button">
          <svg class="bottom-nav-icon" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M3 8 L6 11 L11 4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Tasks
        </button>
        <button
          id="floating-add-button"
          class="floating-add-button"
          type="button"
          aria-label="Add"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="floating-add-plus">+</span>
        </button>
      </nav>
    </main>

    <section id="add-chooser-modal" class="add-chooser-modal" hidden>
      <div id="add-chooser-backdrop" class="add-chooser-backdrop"></div>
      <div class="add-chooser-sheet" role="menu" aria-label="Add">
        <div class="add-chooser-kicker">Add</div>
        <button class="add-chooser-row" data-add-kind="habit" type="button" role="menuitem">
          <span class="add-chooser-icon add-chooser-icon-habit" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path d="M12 21 C 12 14 8 11 4 10 C 4 16 8 20 12 21 Z M12 21 C 12 13 16 9 20 8 C 20 15 16 19 12 21 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M12 21 V 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="add-chooser-body">
            <span class="add-chooser-title">New habit</span>
            <span class="add-chooser-sub"><em>recurring, builds a streak</em></span>
          </span>
        </button>
        <button class="add-chooser-row" data-add-kind="task" type="button" role="menuitem">
          <span class="add-chooser-icon add-chooser-icon-task" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path d="M5 12 L10 17 L19 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="add-chooser-body">
            <span class="add-chooser-title">New task</span>
            <span class="add-chooser-sub"><em>one-off, no streak</em></span>
          </span>
        </button>
      </div>
    </section>

    <section id="composer-modal" class="composer-modal" hidden>
      <div id="composer-backdrop" class="composer-backdrop"></div>
      <div class="composer-sheet" role="dialog" aria-modal="true" aria-labelledby="composer-title">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="composer-sheet-header">
          <h2 id="composer-title">A new <em>habit.</em></h2>
        </div>
        <form id="habit-form" class="composer-form">
          <div id="habit-title-field" class="form-field" hidden>
            <label class="field-label" for="habit-title-input">Title</label>
            <input id="habit-title-input" class="text-input" type="text" maxlength="120" />
          </div>
          <label class="sr-only" for="habit-input">Habit description</label>
          <textarea
            id="habit-input"
            rows="4"
            placeholder="Say it the way you'd say it to a friend…"
          ></textarea>
          <div class="composer-actions">
            <button id="habit-submit-button" type="submit" class="primary-button">Save habit ✦</button>
            <p id="composer-feedback" class="composer-feedback" hidden></p>
          </div>
        </form>
      </div>
    </section>

    <section id="log-sheet-modal" class="composer-modal" hidden>
      <div id="log-sheet-backdrop" class="composer-backdrop"></div>
      <div class="composer-sheet log-sheet" role="dialog" aria-modal="true" aria-labelledby="log-sheet-title">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="composer-sheet-header">
          <h2 id="log-sheet-title">Log day</h2>
          <p id="log-sheet-subtitle" class="composer-feedback"></p>
        </div>
        <div class="composer-form log-sheet-actions">
          <button id="log-sheet-done" type="button" class="action-button done-button">Mark done</button>
          <button id="log-sheet-skip" type="button" class="action-button skip-button">Mark skipped</button>
          <button id="log-sheet-clear" type="button" class="action-button">Clear log</button>
          <button id="log-sheet-cancel" type="button" class="action-button">Cancel</button>
        </div>
      </div>
    </section>

    <section id="reschedule-sheet-modal" class="composer-modal" hidden>
      <div id="reschedule-backdrop" class="composer-backdrop"></div>
      <div class="composer-sheet reschedule-sheet" role="dialog" aria-modal="true" aria-labelledby="reschedule-title">
        <div class="sheet-handle" aria-hidden="true"></div>

        <!-- STEP 1 — pick day + time -->
        <div class="reschedule-step" data-step="pick">
          <div class="composer-sheet-header">
            <span class="reschedule-kicker" id="reschedule-kicker">RESCHEDULE</span>
            <h2 id="reschedule-title">Move habit</h2>
            <p class="reschedule-current" id="reschedule-current"></p>
          </div>

          <div class="reschedule-section">
            <label class="reschedule-label">Day</label>
            <div class="reschedule-day-row" id="reschedule-day-row"></div>
          </div>

          <div class="reschedule-section">
            <label class="reschedule-label">Time</label>
            <div class="reschedule-chip-row" id="reschedule-time-chips">
              <button class="reschedule-chip" type="button" data-minute="360">6 am</button>
              <button class="reschedule-chip" type="button" data-minute="480">8 am</button>
              <button class="reschedule-chip" type="button" data-minute="540">9 am</button>
              <button class="reschedule-chip" type="button" data-minute="720">12 pm</button>
              <button class="reschedule-chip" type="button" data-minute="900">3 pm</button>
              <button class="reschedule-chip" type="button" data-minute="1080">6 pm</button>
              <button class="reschedule-chip" type="button" data-minute="1260">9 pm</button>
            </div>
            <div class="reschedule-fine">
              <span class="reschedule-fine-label">or pick exactly</span>
              <input id="reschedule-time-input" type="time" class="reschedule-time-input" />
            </div>
          </div>

          <div class="reschedule-actions">
            <button id="reschedule-skip-today" class="action-button skip-button" type="button">Skip today</button>
            <button id="reschedule-continue" class="action-button done-button" type="button">Continue</button>
            <button id="reschedule-cancel" class="action-button" type="button">Cancel</button>
          </div>
        </div>

        <!-- STEP 2 — apply scope -->
        <div class="reschedule-step" data-step="scope" hidden>
          <div class="composer-sheet-header">
            <span class="reschedule-kicker">APPLY TO</span>
            <h2>Just today, or every time?</h2>
            <p class="reschedule-current" id="reschedule-scope-summary"></p>
          </div>

          <div class="reschedule-scope-actions">
            <button id="reschedule-scope-today" class="reschedule-scope-card" type="button">
              <span class="scope-card-num">Just today</span>
              <span class="scope-card-meta">One-off — your usual time stays put</span>
            </button>
            <button id="reschedule-scope-every" class="reschedule-scope-card" type="button">
              <span class="scope-card-num">Every time</span>
              <span class="scope-card-meta">Update the recurring time going forward</span>
            </button>
          </div>

          <div class="reschedule-actions">
            <button id="reschedule-scope-back" class="action-button" type="button">‹ Back</button>
          </div>
        </div>
      </div>
    </section>

    <template id="today-card-template">
      <article class="today-card">
        <div class="swipe-actions" aria-hidden="true">
          <div class="swipe-action swipe-action-done">✓</div>
          <div class="swipe-action swipe-action-skip">✕</div>
        </div>
        <div class="today-card-content">
          <div class="tile">
            <img class="tile-illo" alt="" />
          </div>
          <div class="today-card-body">
            <div class="today-card-cat"></div>
            <h2 class="today-card-title"></h2>
            <p class="today-card-meta"></p>
          </div>
          <div class="today-card-pip"></div>
        </div>
      </article>
    </template>

    <template id="habit-row-template">
      <article class="habit-row-card">
        <button class="habit-row-button" type="button">
          <div class="habit-row-leading">
            <div>
              <h2 class="habit-row-title"></h2>
              <p class="habit-row-meta"></p>
            </div>
          </div>
          <div class="habit-row-trailing">
            <span class="habit-row-status"></span>
          </div>
        </button>
      </article>
    </template>

    <template id="task-row-template">
      <article class="task-row">
        <button class="task-checkbox" type="button" aria-label="Toggle done">
          <svg viewBox="0 0 14 14" aria-hidden="true">
            <path d="M3 7 L6 10 L11 4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="task-tag" aria-hidden="true"></div>
        <div class="task-body">
          <h3 class="task-title"></h3>
          <p class="task-meta"></p>
        </div>
        <div class="task-handle" aria-hidden="true">
          <svg viewBox="0 0 14 20" width="14" height="20">
            <circle cx="4" cy="5" r="1.4"/><circle cx="10" cy="5" r="1.4"/>
            <circle cx="4" cy="10" r="1.4"/><circle cx="10" cy="10" r="1.4"/>
            <circle cx="4" cy="15" r="1.4"/><circle cx="10" cy="15" r="1.4"/>
          </svg>
        </div>
      </article>
    </template>

    <template id="calendar-block-template">
      <article class="cal-block">
        <div class="cal-block-stripe" aria-hidden="true"></div>
        <div class="cal-tile" aria-hidden="true">
          <img class="cal-tile-illo" alt="" />
        </div>
        <div class="cal-block-body">
          <div class="cal-block-time"></div>
          <h3 class="cal-block-title"></h3>
          <p class="cal-block-meta"></p>
        </div>
        <button class="cal-block-check" type="button" aria-label="Toggle done">
          <svg viewBox="0 0 14 14" aria-hidden="true">
            <path d="M3 7 L6 10 L11 4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
